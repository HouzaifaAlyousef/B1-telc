name: tests

# كل دفع وكل طلب دمج. الاختبارات ما بدها Supabase ولا مفاتيح —
# بتبني Postgres محلي من الصفر، فبتشتغل على أي عدّاء.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql
          echo "/usr/lib/postgresql/$(ls /usr/lib/postgresql | sort -n | tail -1)/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Werkzeuge
        run: |
          npm install -g playwright deno
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet pglast

      # الترحيلات وأجسام plpgsql بتنفحص قبل ما تنشغل —
      # خطأ نحوي بيبيّن هون بدل ما يوقف نص الجولة
      # نفس السكربت يلي بتشغّله tests/tools.sh — مصدر واحد، فما
      # بيصير خطأ يمرق محلياً ويوقف البايبلاين بعد الدفع
      - name: تحليل SQL
        run: python3 tools/check_sql.py

      - name: فحص JavaScript
        run: |
          for f in assets/app.js assets/api.js assets/i18n.js assets/config.js sw.js \
                   admin/admin.js admin/parse.js; do
            node --check "$f" && echo "  ✓ $f"
          done

      - name: فحص أنواع Edge Functions
        run: |
          deno check supabase/functions/correct-writing/index.ts
          deno check supabase/functions/telegram/index.ts

      - name: قاعدة البيانات + اختبارات SQL
        run: sudo -E ./supabase/tests/run.sh

      - name: الأدوات والمتصفّح
        run: ./tests/run.sh

      # الناتج لازم يبنى وما يحوي ولا مفتاح حل — الحارس بيفشل البناء لو صار
      - name: بناء النشر
        run: ./tools/build_dist.sh

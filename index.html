<!doctype html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#2f6bed">
<meta name="mobile-web-app-capable" content="yes">

    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

# Themenkategorien dieses Projekts.
#
# Eine Quelle kann mehrere treffen. Die staerkste wird zur Hauptkategorie und
# traegt die Note; die uebrigen heben sie an - gedeckelt, weil zehn Themen zu
# streifen nicht dasselbe ist wie eines zu treffen.
#
# Reihenfolge bei Gleichstand = Reihenfolge in dieser Datei.

